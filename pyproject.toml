[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vox-assistant"
version = "0.1.0"
description = "VoxVortex Desktop: a local voice assistant that listens, acts on the PC with permission, and answers in a cloned voice"
requires-python = ">=3.11"
dependencies = [
    "voxvortex",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "sounddevice>=0.5",
    "psutil>=6",
    "faster-whisper>=1.1",
    "onnxruntime>=1.18",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
vox = "vox_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
