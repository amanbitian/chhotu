<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxVortex Desktop</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --mute:#667085; --line:#e3e6ea; --accent:#2f5bea; --ok:#14804a; --warn:#b45309; --bad:#c0362c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171b; --card:#1d2127; --ink:#e8eaed; --mute:#9aa3ad; --line:#2d333b; --accent:#7b9bff; --ok:#4cc38a; --warn:#f0a94b; --bad:#ff7b72; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; font-weight:650; }
  .pills { display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; min-width:0; }
  .pill { font-size:12.5px; padding:2px 10px; border-radius:99px; border:1px solid var(--line); color:var(--mute); }
  .pill.ok { color:var(--ok); border-color:var(--ok); } .pill.bad { color:var(--bad); border-color:var(--bad); }
  main { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap:16px; padding:16px 20px; max-width:1200px; margin:0 auto; }
  /* minmax(0,1fr), not 1fr: a plain 1fr column cannot shrink below its widest content and widened the page on phones */
  @media (max-width: 820px) { main { grid-template-columns: minmax(0,1fr); padding:12px 16px; } }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; min-width:0; }
  section h2 { font-size:14px; margin:0 0 10px; text-transform:uppercase; letter-spacing:.04em; color:var(--mute); font-weight:600; }
  textarea, input[type=text], select { width:100%; background:transparent; color:inherit; border:1px solid var(--line); border-radius:8px; padding:9px 11px; font:inherit; }
  textarea { min-height:96px; resize:vertical; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 16px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  button.danger { background:transparent; color:var(--bad); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .row > * { flex:0 0 auto; max-width:100%; } .row .grow { flex:1 1 160px; min-width:0; }
  .meta { color:var(--mute); font-size:13px; } .err { color:var(--bad); font-size:13.5px; margin-top:8px; }
  audio { width:100%; margin-top:12px; }
  #log { height:340px; overflow:auto; border:1px solid var(--line); border-radius:8px; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:92%; padding:7px 11px; border-radius:10px; white-space:pre-wrap; }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; } .msg.bot { align-self:flex-start; background:var(--bg); border:1px solid var(--line); }
  .chip { align-self:flex-start; font-size:12.5px; color:var(--mute); border:1px dashed var(--line); border-radius:8px; padding:3px 9px; }
  .chip.ok { color:var(--ok); } .chip.bad { color:var(--bad); }
  .confirm { align-self:stretch; border:1px solid var(--warn); border-radius:10px; padding:10px 12px; }
  .confirm b { color:var(--warn); } .confirm .row { margin-top:8px; }
  .voice { display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .voice:first-of-type { border-top:0; } .voice .grow { flex:1 1 180px; min-width:0; }
  table { width:100%; border-collapse:collapse; font-size:13px; } td, th { text-align:left; padding:4px 6px; border-top:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
  th { color:var(--mute); font-weight:600; border-top:0; } .wide { grid-column: 1 / -1; }
  details summary { cursor:pointer; color:var(--mute); }
</style>
</head>
<body>
<header>
  <h1>VoxVortex Desktop</h1>
  <div class="pills" id="pills"><span class="pill">checking…</span></div>
</header>
<main>
  <section>
    <h2>Speak in your voice</h2>
    <textarea id="speakText" placeholder="Type anything, then press Generate."></textarea>
    <div class="row">
      <select id="voiceMode" class="grow" aria-label="Voice">
        <option value="cloned">My cloned voice</option>
        <option value="neutral">Neutral voice (no clone)</option>
      </select>
      <select id="preset" aria-label="Quality">
        <option value="Draft">Draft (fastest)</option><option value="Balanced">Balanced</option><option value="Quality">Quality</option>
      </select>
      <button id="generate">Generate</button>
    </div>
    <div class="meta" id="speakMeta"></div>
    <div class="err" id="speakErr" role="alert"></div>
    <audio id="player" controls hidden></audio>
  </section>

  <section>
    <h2>Assistant</h2>
    <div id="log" aria-live="polite"></div>
    <div class="row">
      <input type="text" id="chatText" class="grow" placeholder="Ask anything, in English, हिन्दी or Hinglish…">
      <button id="send">Send</button>
    </div>
    <div class="row">
      <select id="lang" aria-label="Reply language" style="width:auto">
        <option value="auto">Auto (match me)</option><option value="en">English</option>
        <option value="hi">हिन्दी</option><option value="hinglish">Hinglish</option>
      </select>
      <label class="meta"><input type="checkbox" id="speakReplies"> speak replies</label>
    </div>
  </section>

  <section>
    <h2>Voice profiles</h2>
    <div id="voices" class="meta">Loading…</div>
    <details style="margin-top:12px"><summary>Add a voice from a WAV file</summary>
      <div class="row"><input type="text" id="vName" class="grow" placeholder="name, e.g. me">
        <select id="vLang" aria-label="Recording language" style="width:auto"><option value="en">spoken in English</option><option value="hi">spoken in Hindi</option></select></div>
      <div class="row"><input type="file" id="vFile" accept="audio/wav,.wav"></div>
      <div class="row"><textarea id="vText" placeholder="Exact words spoken in the recording (20–30 s of clean speech works best)"></textarea></div>
      <div class="row"><label class="meta"><input type="checkbox" id="vConsent"> This is my own voice, or I have the speaker's permission to clone it.</label></div>
      <div class="row"><button id="vAdd" class="ghost">Save voice</button><span class="meta" id="vMsg"></span></div>
      <p class="meta">Tip: <code>vox enroll</code> records the reference from your microphone with a guided script.</p>
    </details>
  </section>

  <section>
    <h2>Recent actions</h2>
    <div style="max-height:240px; overflow:auto"><table id="audit"><tbody></tbody></table></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
// The reply-language choice is remembered on this browser; until chosen, it follows the `language` setting.
let langChosen = false;
try { const saved = localStorage.getItem('voxLang'); if (saved) { $('lang').value = saved; langChosen = true; } } catch (_) {}
$('lang').addEventListener('change', () => { langChosen = true; try { localStorage.setItem('voxLang', $('lang').value); } catch (_) {} });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path, body) {
  const opt = body === undefined ? {} : { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  if (!r.ok) { let d = r.statusText; try { d = (await r.json()).detail || d; } catch {} throw new Error(d); }
  return r;
}

async function refresh() {
  try {
    const s = await (await api('/api/status')).json();
    const p = (ok, label) => `<span class="pill ${ok ? 'ok' : 'bad'}">${label}</span>`;
    $('pills').innerHTML = p(s.llm.ok, 'LLM ' + esc(s.llm.ok ? s.llm.model : 'offline')) +
      p(s.tts.ok, s.tts.ok ? (s.tts.model_loaded ? 'voice ready' : 'voice service up (model loads on first use)') : 'cloned voice offline') +
      `<span class="pill">${esc(s.active_voice || 'no voice profile')}</span>`;
    if (!langChosen) $('lang').value = s.language || 'auto';
    renderVoices(s.voices, s.active_voice, s.active_voice_hi);
  } catch (e) { $('pills').innerHTML = `<span class="pill bad">${esc(e.message)}</span>`; }
  const a = await (await api('/api/audit?limit=15')).json();
  $('audit').querySelector('tbody').innerHTML = '<tr><th>When</th><th>What</th><th>Decision</th><th>Result</th></tr>' +
    a.events.map(e => `<tr><td>${new Date(e.ts*1000).toLocaleTimeString()}</td><td>${esc(e.tool || e.kind)}</td><td>${esc(e.decision)}</td><td>${esc(e.summary)}</td></tr>`).join('');
}

function renderVoices(list, active, activeHi) {
  // A voice recorded in Hindi is used for Hindi speech; the main (English) voice for everything else.
  const tag = v => v.id === active ? '<span class="pill ok">active</span>' :
    (v.id === activeHi ? '<span class="pill ok">active for Hindi</span>' : '');
  const inUse = v => v.id === active || v.id === activeHi;
  $('voices').innerHTML = list.length ? list.map(v => `
    <div class="voice"><div class="grow"><b>${esc(v.id)}</b> ${tag(v)}
      <div class="meta">${(v.language || 'en') === 'hi' ? 'Hindi' : 'English'} · ${v.quality.seconds.toFixed(0)} s · SNR ${v.quality.snr_db.toFixed(0)} dB · ${esc(v.source)}</div></div>
      ${inUse(v) ? '' : `<button class="ghost" data-act="${esc(v.id)}">Use</button>`}
      <button class="danger" data-rev="${esc(v.id)}">Delete</button></div>`).join('') :
    'No voice profile yet. Run <code>vox enroll</code>, or add a WAV below.';
}
$('voices').addEventListener('click', async e => {
  const act = e.target.dataset.act, rev = e.target.dataset.rev;
  if (act) { await api(`/api/voices/${act}/activate`, {}); refresh(); }
  if (rev && confirm(`Delete ${rev}? Its recording and derived data are removed from this PC.`)) { await api(`/api/voices/${rev}/revoke`, {}); refresh(); }
});

$('generate').onclick = async () => {
  const text = $('speakText').value.trim(); if (!text) return;
  $('speakErr').textContent = ''; $('speakMeta').textContent = 'Generating…'; $('generate').disabled = true;
  const t0 = performance.now();
  try {
    const r = await api('/api/speak', { text, voice_mode: $('voiceMode').value, preset: $('preset').value });
    const blob = await r.blob(); $('player').src = URL.createObjectURL(blob); $('player').hidden = false; $('player').play();
    const rtf = r.headers.get('x-rtf');
    $('speakMeta').textContent = `${((performance.now()-t0)/1000).toFixed(1)} s total` + (rtf ? ` · ${r.headers.get('x-audio-seconds')} s of audio · real-time factor ${rtf}` : '') + ` · voice ${r.headers.get('x-voice') || ''}`;
  } catch (e) { $('speakErr').textContent = e.message; $('speakMeta').textContent = ''; }
  $('generate').disabled = false;
};

const log = $('log');
function add(cls, text) { const d = document.createElement('div'); d.className = cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
async function send() {
  const text = $('chatText').value.trim(); if (!text) return;
  $('chatText').value = ''; add('msg user', text); $('send').disabled = true;
  voice.stop();
  let bot = null, said = '', pending = '';
  const speakOn = $('speakReplies').checked;
  try {
    const r = await api('/api/chat', { text, language: $('lang').value });
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream:true });
      let i; while ((i = buf.indexOf('\n')) >= 0) { handle(JSON.parse(buf.slice(0, i))); buf = buf.slice(i + 1); }
    }
  } catch (e) { add('chip bad', e.message); }
  $('send').disabled = false;
  if (speakOn && pending.trim()) voice.say(pending);
  function handle(ev) {
    if (ev.type === 'say') {
      if (!bot) bot = add('msg bot', ''); said += ev.text; bot.textContent = said; log.scrollTop = log.scrollHeight;
      if (speakOn) {  // speak each sentence as soon as it is complete, not the whole reply at the end
        pending += ev.text; let m;
        while ((m = pending.match(/^[\s\S]*?[.!?](\s+|$)/)) && m[1]) { voice.say(m[0]); pending = pending.slice(m[0].length); }
      }
    }
    else if (ev.type === 'tool') { bot = null; add('chip', `${ev.name} ${JSON.stringify(ev.args)} (${ev.risk})`); }
    else if (ev.type === 'tool_result') add('chip ' + (ev.ok ? 'ok' : 'bad'), `${ev.name}: ${ev.ok ? 'done' : 'not done'}${ev.detail ? ' — ' + ev.detail : ''} [${ev.decision}]`);
    else if (ev.type === 'confirm_request') askConfirm(ev);
    else if (ev.type === 'error') add('chip bad', ev.message);
  }
}
function askConfirm(ev) {
  const d = document.createElement('div'); d.className = 'confirm';
  d.innerHTML = `<b>Approve?</b> I want to ${esc(ev.intent)}.<div class="row"><button data-y>Approve</button><button class="ghost" data-n>Decline</button></div>`;
  d.addEventListener('click', async e => {
    if (!('y' in e.target.dataset) && !('n' in e.target.dataset)) return;
    const approve = 'y' in e.target.dataset; d.querySelector('.row').remove();
    d.append(approve ? ' ✓ approved' : ' ✗ declined');
    await api('/api/confirm', { id: ev.id, approve }).catch(err => d.append(' (' + err.message + ')'));
  });
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
// Streamed speech: each sentence is fetched as raw PCM and every chunk is scheduled the moment it arrives, so the first
// words play while the rest is still being synthesized. Sentences are fetched one after another and queue up seamlessly.
const voice = {
  ctx: null, head: 0, chain: Promise.resolve(), gen: 0, sources: [],
  say(text) {
    const gen = this.gen;
    this.chain = this.chain.then(() => gen === this.gen && this.stream(text, gen)).catch(e => add('chip bad', 'speech: ' + e.message));
  },
  stop() { this.gen++; this.sources.forEach(s => { try { s.stop(); } catch (_) {} }); this.sources = []; this.head = 0; },
  async stream(text, gen) {
    this.ctx = this.ctx || new AudioContext();
    if (this.ctx.state === 'suspended') await this.ctx.resume();
    const r = await fetch('/api/speak/stream', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text, voice_mode: $('voiceMode').value, preset: 'Draft' }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
    const rate = +r.headers.get('X-Sample-Rate'), reader = r.body.getReader();
    let carry = new Uint8Array(0);
    for (;;) {
      const { value, done } = await reader.read();
      if (done || gen !== this.gen) { if (!done) reader.cancel(); break; }
      const bytes = new Uint8Array(carry.length + value.length); bytes.set(carry); bytes.set(value, carry.length);
      const n = bytes.length - (bytes.length % 2); carry = bytes.slice(n);
      if (!n) continue;
      const pcm = new Int16Array(bytes.buffer, 0, n / 2);
      const buf = this.ctx.createBuffer(1, pcm.length, rate), ch = buf.getChannelData(0);
      for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
      const src = this.ctx.createBufferSource(); src.buffer = buf; src.connect(this.ctx.destination);
      this.head = Math.max(this.head, this.ctx.currentTime + 0.03); src.start(this.head); this.head += buf.duration;
      this.sources.push(src); src.onended = () => { this.sources = this.sources.filter(s => s !== src); };
    }
  },
};
function speakText(text) { voice.say(text); }
$('send').onclick = send; $('chatText').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

$('vAdd').onclick = async () => {
  const f = $('vFile').files[0]; $('vMsg').textContent = '';
  if (!f) { $('vMsg').textContent = 'Choose a WAV file.'; return; }
  const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(f); });
  try { await api('/api/voices', { name: $('vName').value, transcript: $('vText').value, permission_confirmed: $('vConsent').checked, wav_base64: b64, language: $('vLang').value }); $('vMsg').textContent = 'Saved and activated.'; refresh(); }
  catch (e) { $('vMsg').textContent = e.message; }
};
async function pollReminders() {
  try {
    const d = await (await api('/api/reminders/due')).json();
    for (const r of d.due) { add('chip ok', 'Reminder: ' + r.text); speakText('Reminder: ' + r.text); }
  } catch {}
}
refresh(); setInterval(refresh, 15000); setInterval(pollReminders, 5000);
</script>
</body>
</html>
